<h1>dwugłoski</h1>
<p>W języku maryjskim nie ma dwugłosek; dwie samogłoski stojące obok siebie wymawia się w oddzielnych sylabach.</p>
<ul>
<li><b>куэ</b> <i>ku‧e</i> ‘brzoza’,</li>
<li><b>пиал</b> <i>pi‧al</i> ‘szczęście’,</li>
<li><b>пуаш</b> <i>pu‧aš</i> ‘dać’,</li>
<li><b>тау</b> <i>ta‧u</i> ‘dziękuję’.</li>
</ul>
