<h1>alfabet</h1>
<p>Alfabet maryjski to 36-literowa grażdanka: <b>а б в г д е ё ж з и й к л м н ҥ о ӧ п р с т у ӱ ф х ц ч ш щ ъ ы ь э ю я</b>.</p>
<p>Litery <b>ё</b>, <b>ф</b>, <b>х</b>, <b>ц</b>, <b>щ</b> występują tylko w zapożyczeniach.</p>
